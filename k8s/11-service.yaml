apiVersion: v1
kind: Service
metadata:
  name: autenticacao
  namespace: oficina-mecanica
  labels:
    app: autenticacao
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  # NodePort 30081 = porta do listener do servico na NLB interna (infra-k8s); o API Gateway chega
  # aqui via VPC Link. Dentro do cluster o servico responde em autenticacao.oficina-mecanica:80.
  type: NodePort
  selector:
    app: autenticacao
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
