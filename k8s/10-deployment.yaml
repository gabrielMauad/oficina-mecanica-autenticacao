apiVersion: apps/v1
kind: Deployment
metadata:
  name: autenticacao
  namespace: oficina-mecanica
  labels:
    app: autenticacao
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  # Com HPA ativo, o numero de replicas passa a ser decidido por ele (12-hpa.yaml); este valor
  # so vale ate o primeiro ciclo do autoscaler.
  replicas: 1
  selector:
    matchLabels:
      app: autenticacao
  template:
    metadata:
      labels:
        app: autenticacao
    spec:
      containers:
        - name: autenticacao
          # Substituido pela pipeline pela URI do ECR com a tag = SHA do commit.
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # ConfigMap = chaves nao sensiveis; Secret autenticacao-secrets = segredo JWT, senha do
          # login da oficina e header OTLP, criado pela pipeline a partir do Secrets Manager.
          envFrom:
            - configMapRef:
                name: autenticacao-config
            - secretRef:
                name: autenticacao-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Este servico nao tem banco nem outra dependencia externa: a readiness reflete apenas o
          # proprio processo (as probes seguem o mesmo padrao dos demais servicos).
          startupProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
